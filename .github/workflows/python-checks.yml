name: Python 检查

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --locked --extra web --extra ml --dev

      - name: 运行 Ruff 静态检查
        run: uv run ruff check src tests

      - name: 检查 Ruff 格式
        run: uv run ruff format --check src tests

      - name: 运行测试
        run: uv run --extra ml pytest
